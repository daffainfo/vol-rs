name: release

# Builds a binary for each platform and attaches it to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the binaries to
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # One platform failing should not stop the others from publishing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          # Apple ships both architectures in one SDK, so the Intel build is
          # made on the same runner rather than needing an Intel one.
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    steps:
      # The tag names what to build, so it is settled before anything is
      # fetched and every later step reads it from here.
      - name: Settle the tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}

      # A release must be built from the commit its tag names, so that is
      # checked rather than assumed.
      - name: Check the tag against what was checked out
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"
          want=$(git rev-list -n 1 "refs/tags/$tag")
          got=$(git rev-parse HEAD)
          echo "tag $tag names $want, building $got"
          [ "$want" = "$got" ]

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The two Mac builds share one runner, so the architecture is checked
      # rather than assumed.
      - name: Check the architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          want="${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}"
          got=$(lipo -archs "target/${{ matrix.target }}/release/vol-rs")
          echo "wanted $want, built $got"
          [ "$got" = "$want" ]

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"
          name="vol-rs-${tag}-${{ matrix.platform }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/vol-rs" "$name/"
          cp README.md LICENSE BENCHMARKS.md "$name/"
          # What this was built from, so an archive can be traced back to it.
          printf 'tag %s\ncommit %s\nplatform %s\ntarget %s\n' \
            "$tag" "$(git rev-parse HEAD)" "${{ matrix.platform }}" "${{ matrix.target }}" \
            > "$name/BUILD-INFO"
          tar czf "${name}.tar.gz" "$name"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          $name = "vol-rs-$tag-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vol-rs.exe" $name
          Copy-Item README.md, LICENSE, BENCHMARKS.md $name
          # What this was built from, so an archive can be traced back to it.
          $commit = git rev-parse HEAD
          "tag $tag`ncommit $commit`nplatform ${{ matrix.platform }}`ntarget ${{ matrix.target }}" |
            Out-File -Encoding ascii "$name/BUILD-INFO"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          # Each platform builds one kind of archive, so a pattern that matches
          # nothing here drops out rather than being passed along as it stands.
          shopt -s nullglob
          files=(vol-rs-*.tar.gz vol-rs-*.tar.gz.sha256 vol-rs-*.zip vol-rs-*.zip.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archive was produced for ${{ matrix.platform }}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber
